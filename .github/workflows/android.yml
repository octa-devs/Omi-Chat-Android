name: Android

# A push to main proves the build still works but publishes nothing. A tag is
# what actually releases: it produces the APK and attaches it to a GitHub
# release that anyone can download from the Releases page or from the in-app
# update link.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Attach the APK to a GitHub release
        type: boolean
        default: true
      tag:
        description: Tag to release under, e.g. v1.0.0 (blank = build only)
        type: string

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The Gradle project is a subdirectory of this repository; the web app sits
    # beside it. Every run step executes from android/ so that ./gradlew, the
    # keystore.properties path that rootProject.file() resolves, and the
    # app/build/outputs lookups all stay correct without rewriting each of them.
    #
    # This does NOT affect `uses:` actions such as upload-artifact, which keep
    # running from the workspace root. Anything those actions are handed must
    # therefore be an absolute path.
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Reads gradle/wrapper/gradle-wrapper.properties, so the Gradle version is
      # pinned in the repository rather than duplicated here.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Signing is optional by design: with no secrets the release variant falls
      # back to the debug key, so the pipeline always produces an installable
      # APK instead of failing the moment the secrets are absent.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.OMI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.OMI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OMI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OMI_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning title=Unsigned build::OMI_KEYSTORE_BASE64 is not set, falling back to a debug-signed APK. It installs, but cannot upgrade an install that was signed with a real key."
            exit 0
          fi

          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/omi-release.jks"

          # storeFile is absolute; app/build.gradle.kts resolves it with
          # file(), which accepts an absolute path as-is.
          umask 077
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/omi-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          # The properties file must not be readable by anything but this job,
          # and must not end up in the build cache.
          chmod 600 keystore.properties

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            name="${GITHUB_REF#refs/tags/v}"
          else
            name="0.0.${GITHUB_RUN_NUMBER}"
          fi
          # YYMMDD as an integer. Android only requires this to increase, and
          # this keeps it monotonic without keeping build metadata in the repo.
          code=$(( 10#$(date -u +%y%m%d) ))
          {
            echo "name=$name"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease \
            -PomiVersionName="${{ steps.version.outputs.name }}" \
            -PomiVersionCode="${{ steps.version.outputs.code }}" \
            2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # A red build is only useful if the reason outlives it. The raw task log is
      # not readable without a token, so the interesting lines are re-emitted
      # twice: into the run summary for a human, and as annotations, which the
      # check-run API serves over plain HTTPS. The second copy is what lets an
      # automated fix read the error without anyone pasting it back.
      - name: Explain the failure
        if: failure()
        run: |
          log="$RUNNER_TEMP/gradle.log"
          if [ ! -f "$log" ]; then
            echo "::error::Gradle wrote no log at all."
            exit 0
          fi

          interesting() {
            grep -E '^(e|w): |error:|FAILURE:|BUILD FAILED|Execution failed for task|^> Task .*FAILED|^[[:space:]]+> ' "$log" \
              | head -n 120
          }

          {
            echo "### Why the build failed"
            echo ""
            echo '```'
            interesting
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          interesting \
            | grep -E '^(e: |.*error:|Execution failed for task|> Task .*FAILED)' \
            | head -n 60 \
            | while IFS= read -r line; do
                # % would otherwise be read as the start of a workflow-command
                # escape, and a bare newline cannot appear in an annotation.
                line="${line//%/%25}"
                printf '::error title=Gradle::%s\n' "$line"
              done

      - name: Collect artifact
        id: collect
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi
          version="${{ steps.version.outputs.name }}"
          out="OmiChat-${version}.apk"
          # Absolute, because upload-artifact resolves `path` from the workspace
          # root rather than from this step's working-directory.
          dest="$GITHUB_WORKSPACE/$out"
          cp "$apk" "$dest"

          # A truncated or empty APK is the failure mode that actually reaches a
          # user, so refuse to upload one rather than shipping it.
          size=$(stat -c%s "$dest")
          if [ "$size" -lt 200000 ]; then
            echo "::error::APK is only ${size} bytes, which is far too small to be a real build."
            exit 1
          fi
          unzip -l "$dest" | grep -q classes.dex || {
            echo "::error::APK contains no classes.dex."
            exit 1
          }

          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "path=$dest" >> "$GITHUB_OUTPUT"
          echo "### $out ($((size / 1024)) KB)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmiChat-apk
          path: ${{ steps.collect.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      # Publishing is driven by a tag. On a manual run it happens only when the
      # publish box is ticked and a tag is supplied.
      - name: Decide release
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          tag=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [ "${DISPATCH_PUBLISH:-false}" = "true" ] && [ -n "${DISPATCH_TAG:-}" ]; then
            tag="$DISPATCH_TAG"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.collect.outputs.path }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          # Re-running a tag must replace the asset rather than fail, otherwise
          # a fixed build cannot be re-shipped under the same version.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            echo "Replaced the APK on existing release $TAG"
          else
            gh release create "$TAG" "$ASSET" \
              --title "Omi Chat $VERSION" \
              --generate-notes
            echo "Created release $TAG"
          fi

      - name: Build summary
        if: always()
        run: |
          {
            echo "### Android build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| version | \`${{ steps.version.outputs.name }}\` |"
            echo "| versionCode | ${{ steps.version.outputs.code }} |"
            echo "| release | \`${{ steps.release.outputs.tag || 'not published (build only)' }}\` |"
            echo "| signed with | ${{ secrets.OMI_KEYSTORE_BASE64 != '' && 'release key' || 'debug key' }} |"
          } >> "$GITHUB_STEP_SUMMARY"